# ID of the text channel where players should use /join.
# Leave blank to allow /join from any normal text channel.
game.channel.id=

# true = each /join creates a public player thread under the game channel.
player.threads.enabled=true

# Board settings
board.start.space=1
board.final.space=90
board.die.sides=6

# If true, a player who lands on a previously verified/completed square may roll again immediately.
completed.space.is.free=true

# Maximum proof screenshots accepted by /complete.
proof.max.attachments=5

# true = at least one screenshot is required for every challenge submission.
# Set false if you want moderators to allow text/honor-system submissions too.
proof.required=true
